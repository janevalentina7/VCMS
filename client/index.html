<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10367a" />
    <meta
      name="description"
      content="Village Complaint Management System - a digital grievance redressal portal for registering, tracking and resolving village complaints."
    />
    <title>Village Complaint Management System | Digital Grievance Redressal Portal</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('vcms.theme') || 'system';
          var dark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-canvas text-ink antialiased">
    <div id="root" class="h-full"></div>
    <noscript>This portal requires JavaScript to be enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
